# The Orca automations machine/install.py manages; see docs/install.md.
#
# Each [[automation]] holds exactly:
#   name     the automation's name in Orca, also its key in the installer manifest
#   role     a roster/roles.toml role id; its default provider, model and effort run the automation
#   trigger  a 5-field cron expression in the host's local time
#   prompt   the prompt each scheduled run starts with
#            (the installer appends a sentence naming its install-time Python interpreter)
#
# Every automation runs in the repository's primary checkout (an existing Orca workspace, resolved
# from Orca at install time) with a fresh session per run.

[[automation]]
name = "Orca Pod: daily cleanup sweep"
role = "ops"
trigger = "30 6 * * *"
prompt = """
$cleanup-task-artifacts Run the installed daily sweep exactly as this skill defines it. \
This automation grants exactly the skill's conservative sweep removal: remove a worktree only when its inventory \
disposition is `candidate`, its repository identity matches a repository that passed this run's discovery, its delivery \
is shown by hosted evidence, it has been idle more than 7 days, no live Orca agent or terminal is attached, and only \
with `orca worktree rm --worktree id:<worktreeId>` after rechecking it. \
Everything else is report-only: stop, release or remove nothing else. \
Report only this run's cleanup actions and what changed since the previous sweep, as the skill's `sweep_state.py` reports it.
"""

[[automation]]
name = "Orca Pod: engineering brief"
role = "wrk"
trigger = "0 7 * * 1,4"
prompt = """
Use the engineering-brief skill to write this scheduled edition of the brief, including the weekly watchlist review \
when the skill says it is due. Save and render it as the skill defines, then finish with its short summary and links. \
Write every draft, note, report and render output of this run only inside the archive that the skill's \
`history.py context` returns, with drafts in its `drafts` directory and quote checks, downloaded pages and other \
scratch files in its `work` directory, and write nothing anywhere else. \
This run authorizes no topic workspaces, repository changes, commits, pushes, publication, tracker writes or \
schedule changes, and no installing or repairing prerequisites outside that archive: if one is missing or broken, \
stop and report it.
"""
