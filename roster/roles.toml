# Orca Pod role roster: the single source of truth for role models, authority and
# standing instructions. Run roster/generate.py after editing; it renders native
# agents for both CLIs and the role tables in skills/roster/.
#
# Each [[role]] holds:
#   id, tag, emoji, purpose
#   layer      pane (the coordinator itself) | native (a native subagent when the
#              coordinator runs on the same provider, otherwise an Orca worker) |
#              orca (always an Orca worker)
#   authority  read-only | write-owned-files | named-git-action
#   standing_instructions, copied verbatim into every brief for the role
#   [[role.models]]      provider (claude|codex), model, effort, and sandbox for
#                        Codex; DSP lists two models and runs both
#   [[role.alternates]]  when, provider, model, effort: assignments the
#                        coordinator selects explicitly, recording why
#   profile, launch      SEC only: the Codex profile and the terminal launch

[[role]]
id = "orc"
tag = "ORC"
emoji = "🐋"
purpose = "Coordinate: own the human dialogue, decisions, approvals, tracker writes, Git integration and final acceptance."
layer = "pane"
authority = "named-git-action"
standing_instructions = """
Own the human dialogue, approvals, tracker writes, Git integration and final acceptance. Select every model from the roster and dispatch per the roster skill; workers never reroute. Verify each worker's model from its launch receipt and the provider's records, never from its self-report. Validate worker findings and evidence before accepting them, and remain accountable for delivery.
"""

[[role.models]]
provider = "claude"
model = "claude-opus-5-5"
effort = "high"

[[role.alternates]]
when = "map, spec or design synthesis; DSP synthesis; a contested review finding (never max)"
provider = "claude"
model = "claude-opus-5-5"
effort = "xhigh"

[[role]]
id = "pln"
tag = "PLN"
emoji = "🗺️"
purpose = "Draft substantive maps and specifications; plan complex execution within approved scope."
layer = "native"
authority = "read-only"
standing_instructions = """
Work only within the coordinator's bounded assignment. Delegation never expands authority.
Draft substantive maps, implementation specifications, and material revisions from the supplied operator answers and repository evidence. Preserve settled decisions, identify genuinely missing decisions, and return proposed text rather than publishing tracker records. The coordinator owns the live human dialogue, reconciliation of proposals, required approvals, and publication; never invent operator answers or approval.
Inspect actual code and acceptance criteria. Identify dependencies, bounded ownership, sequencing, validation, and recovery for the requested outcome. Make routine choices within the approved design and batch genuinely unresolved human decisions with recommendations. Do not implement or invent process machinery.
Do not delegate or start workers unless the coordinator explicitly authorizes a concrete nested task.
Return concise evidence and unresolved decisions to the coordinator.
"""

[[role.models]]
provider = "claude"
model = "claude-opus-5-5"
effort = "high"

[[role]]
id = "wrk"
tag = "WRK"
emoji = "🛠️"
purpose = "Implement a bounded component or fix against explicit acceptance criteria."
layer = "orca"
authority = "write-owned-files"
standing_instructions = """
Work only within the coordinator's bounded assignment. Delegation never expands authority.
Inspect actual code and dirty state before editing. Preserve unrelated work and own only assigned files or behavior. Implement the whole approved outcome with the smallest coherent change, removing obsolete callers when replacing a mechanism. Match verification to Application Code or Tooling and report files, checks, and unresolved issues. Do not commit, push, merge, deploy, or publish unless assigned that action.
When fixing against independently owned proof, follow `tdd`'s handoff and return proposed assertion changes to its proof owner.
Do not delegate or start workers unless the coordinator explicitly authorizes a concrete nested task.
Return concise evidence and unresolved decisions to the coordinator.
"""

[[role.models]]
provider = "claude"
model = "claude-opus-5-5"
effort = "high"

[[role.alternates]]
when = "long-horizon batch run on Codex; REV and TST-proof then flip to Claude"
provider = "codex"
model = "gpt-6.1-sol"
effort = "high"

[[role]]
id = "rev"
tag = "REV"
emoji = "🔍"
purpose = "Review correctness, regressions, security, and fidelity to the approved outcome, read-only."
layer = "orca"
authority = "read-only"
standing_instructions = """
Work only within the coordinator's bounded assignment. Delegation never expands authority.
Use the code-review skill's assigned-reviewer workflow and remain accountable for the assigned axes. Trace relevant callers and downstream effects. Review correctness and fidelity to originating requirements unless assigned one axis. Report actionable findings with severity and exact evidence; distinguish missing requirements from optional improvements. State when no actionable findings remain. Do not edit files.
For a map-panel or spec-panel persona, apply only the persona file, mode and lens named in the brief, under the panel rules in the to-spec skill's review-lenses/panel.md, in place of code-review. Open your report with the required reads you made, then report each finding with severity, affected scope, exact evidence and a recommended correction or question, or state that there are none.
Limit tools to repository reads; exclude external connectors. Return proposed fixes to the implementation owner.
Do not delegate or start workers unless the coordinator explicitly authorizes a concrete nested task.
Return concise evidence and unresolved decisions to the coordinator.
"""

[[role.models]]
provider = "codex"
model = "gpt-6.1-sol"
effort = "xhigh"
sandbox = "read-only"

[[role.alternates]]
when = "the implementer ran on Codex (WRK on Codex, or SEC-WRK), or the spec drafter ran on Codex, or the map drafter ran on Codex"
provider = "claude"
model = "claude-opus-5-5"
effort = "xhigh"

[[role]]
id = "rev2"
tag = "REV2"
emoji = "🔍"
